<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const mount=document.querySelector('#game'),scene=new THREE.Scene();
scene.background=new THREE.Color(0x171b43);
scene.fog=new THREE.FogExp2(0x30365f,.00072);
const camera=new THREE.PerspectiveCamera(62,innerWidth/innerHeight,.1,2000);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;
mount.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xabbcff,0x43536a,1.7));
const moonLight=new THREE.DirectionalLight(0xc7d7ff,2.0);moonLight.position.set(-170,240,-120);moonLight.castShadow=true;
moonLight.shadow.mapSize.set(1024,1024);moonLight.shadow.camera.left=-240;moonLight.shadow.camera.right=240;moonLight.shadow.camera.top=240;moonLight.shadow.camera.bottom=-240;scene.add(moonLight);
const fill=new THREE.PointLight(0x9bbaff,1.2,260);fill.position.set(-120,75,-100);scene.add(fill);
const mat=(c,r=1)=>new THREE.MeshStandardMaterial({color:c,roughness:r});
const grassMat=mat(0x6e9e78),rockMats=[mat(0x68758d),mat(0x7d879b),mat(0x53647a)],woodMat=mat(0x604a51);
const leafMats=[mat(0x376d67),mat(0x477e72),mat(0x5b8b78),mat(0x718f7d)];
const flowerMats=[mat(0xffe8ae),mat(0xf3b6d1),mat(0xbfc6ff),mat(0xffffff)];
const rand=(a,b)=>a+Math.random()*(b-a);
const blockers=[],fallingTrees=[],treeDebris=[],treeRespawns=[];
function block(x,z,r){blockers.push({x,z,r});}
function heightAt(x,z){
 const base=4+Math.sin(x*.021+Math.cos(z*.017))*1.8+Math.sin(z*.037-x*.013)*1.1+Math.cos((x+z)*.012)*2.3+Math.sin(x*.008)*2+Math.max(0,1-Math.abs(x-170)/150)*Math.max(0,1-Math.abs(z+115)/190)*28;
 // A broad, gently levelled natural basin lets the harbor water meet the shore.
 const d=Math.hypot(x-275,z+235),blend=1-THREE.MathUtils.smoothstep(d,43,76);
 const harborLevel=base*.25+3.0;
 return THREE.MathUtils.lerp(base,harborLevel,blend);
}
const cityX=510,cityZ=0,cityTop=6;
const mallCenterX=cityX-8,mallCenterZ=55,mallFrontZ=mallCenterZ+38;
function groundAt(x,z){
 if(Math.hypot(x-cityX,z-cityZ)<112){
  // Two broad escalator/ramp lanes connect the entrance level to the upper gallery.
  for(const rx of [mallCenterX-23,mallCenterX+23]){
   if(Math.abs(x-rx)<5.8 && z>=mallCenterZ-10 && z<=mallFrontZ-1){
    const t=THREE.MathUtils.clamp((mallFrontZ-1-z)/(mallFrontZ-1-(mallCenterZ-10)),0,1);
    return cityTop+12*t;
   }
  }
  const inside=Math.abs(x-mallCenterX)<46 && z>mallCenterZ-37 && z<mallCenterZ+37;
  if(inside){
   // Ground-floor corridors stay level. Upper galleries are visual balconies only;
   // players reach the upper level only by using the two continuous ramp lanes above.
  }
  return cityTop;
 }
 return heightAt(x,z);
}
function addMesh(geo,material,x,y,z,sx=1,sy=1,sz=1){const m=new THREE.Mesh(geo,material);m.position.set(x,y,z);m.scale.set(sx,sy,sz);m.castShadow=true;m.receiveShadow=true;scene.add(m);return m;}

// Rich midnight sky: stars, Milky Way dust, moon and halo
const starPositions=[],starColors=[];
for(let i=0;i<2600;i++){
 const u=Math.random()*Math.PI*2,v=Math.acos(rand(-1,1)),r=1250;
 const x=r*Math.sin(v)*Math.cos(u),y=Math.abs(r*Math.cos(v)),z=r*Math.sin(v)*Math.sin(u);
 starPositions.push(x,y,z);
 const c=new THREE.Color().setHSL(rand(.53,.72),rand(.25,.7),rand(.65,1));starColors.push(c.r,c.g,c.b);
}
const starGeo=new THREE.BufferGeometry();starGeo.setAttribute('position',new THREE.Float32BufferAttribute(starPositions,3));starGeo.setAttribute('color',new THREE.Float32BufferAttribute(starColors,3));
const stars=new THREE.Points(starGeo,new THREE.PointsMaterial({size:2.3,vertexColors:true,transparent:true,opacity:.95,sizeAttenuation:false}));scene.add(stars);
// Extra distant star clusters add depth to the night sky.
for(let layer=0;layer<3;layer++){const pts=[];for(let i=0;i<420;i++){const a=rand(0,Math.PI*2),r=rand(380,1050);pts.push(Math.cos(a)*r,rand(100,650),Math.sin(a)*r);}const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pts,3));scene.add(new THREE.Points(g,new THREE.PointsMaterial({color:layer===1?0xb8caff:0xe5dcff,size:layer===1?1.6:1.1,transparent:true,opacity:.48,sizeAttenuation:false})));}
// Milky-way ribbon of tiny stars
const dustPos=[];
for(let i=0;i<1900;i++){const t=rand(-1,1),a=rand(-1,1);dustPos.push(t*650,210+a*48+Math.sin(t*5)*32,-430+t*170);}
const dustGeo=new THREE.BufferGeometry();dustGeo.setAttribute('position',new THREE.Float32BufferAttribute(dustPos,3));
scene.add(new THREE.Points(dustGeo,new THREE.PointsMaterial({color:0xc7cfff,size:2.2,transparent:true,opacity:.7,sizeAttenuation:false})));
const moon=new THREE.Mesh(new THREE.SphereGeometry(31,48,40),new THREE.MeshStandardMaterial({color:0xfff0d2,emissive:0xffdca0,emissiveIntensity:.55,roughness:1}));
moon.position.set(-185,205,-470);scene.add(moon);
const halo=new THREE.Mesh(new THREE.SphereGeometry(43,32,24),new THREE.MeshBasicMaterial({color:0xb9caff,transparent:true,opacity:.11,side:THREE.BackSide}));halo.position.copy(moon.position);scene.add(halo);
const moonGlow=new THREE.PointLight(0xbacaff,2.4,520);moonGlow.position.copy(moon.position);scene.add(moonGlow);
// Soft luminous cloud banks
const cloudMat=new THREE.MeshStandardMaterial({color:0x8d9ac9,transparent:true,opacity:.33,roughness:1});
for(let i=0;i<36;i++){const g=new THREE.Group(),x=rand(-550,550),z=rand(-550,550),y=rand(90,170);for(let j=0;j<6;j++){const p=new THREE.Mesh(new THREE.SphereGeometry(rand(8,18),10,8),cloudMat);p.position.set(rand(-17,17),rand(-4,4),rand(-10,10));p.scale.y=.55;g.add(p);}g.position.set(x,y,z);scene.add(g);}

// Rolling natural terrain with vertex color variation
const size=760,seg=230,geo=new THREE.PlaneGeometry(size,size,seg,seg);geo.rotateX(-Math.PI/2);
const pos=geo.attributes.position,colors=[];
const cA=new THREE.Color(0x789f7c),cB=new THREE.Color(0x547e75),cC=new THREE.Color(0x9aa18b),cD=new THREE.Color(0x687d91);
for(let i=0;i<pos.count;i++){const x=pos.getX(i),z=pos.getZ(i),h=heightAt(x,z);pos.setY(i,h);let c=cA.clone();const n=Math.sin(x*.035)*Math.cos(z*.03);if(n>.35)c.lerp(cB,.3);if(h>23)c.lerp(cC,.4);if(n<-.7)c.lerp(cD,.16);colors.push(c.r,c.g,c.b);}
geo.setAttribute('color',new THREE.Float32BufferAttribute(colors,3));geo.computeVertexNormals();
const terrain=new THREE.Mesh(geo,new THREE.MeshStandardMaterial({vertexColors:true,roughness:1}));terrain.receiveShadow=true;scene.add(terrain);


// Restored green, breakable trees across the main island (kept clear of the Outlet island).
for(let i=0;i<420;i++){
 const x=rand(-340,340),z=rand(-340,340);
 if(Math.hypot(x,z)<32 || Math.hypot(x-510,z)<142) continue;
 const y=heightAt(x,z),sc=rand(.72,1.3),tree=new THREE.Group();
 tree.position.set(x,y,z);scene.add(tree);
 const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.32*sc,.65*sc,6*sc,7),woodMat);
 trunk.position.y=3*sc;trunk.castShadow=true;tree.add(trunk);
 const crown=new THREE.Mesh(new THREE.SphereGeometry(4.2*sc,10,9),leafMats[i%leafMats.length]);
 crown.position.y=8*sc;crown.scale.set(1,1.15,1);crown.castShadow=true;tree.add(crown);
 const crown2=new THREE.Mesh(new THREE.SphereGeometry(3.2*sc,9,8),leafMats[(i+1)%leafMats.length]);
 crown2.position.set(rand(-1.6,1.6)*sc,10.2*sc,rand(-1.5,1.5)*sc);crown2.scale.set(.95,.9,.95);crown2.castShadow=true;tree.add(crown2);
 for(let b=0;b<2;b++){
  const branch=new THREE.Mesh(new THREE.CylinderGeometry(.12*sc,.2*sc,2.6*sc,5),woodMat);
  branch.position.set((b?1:-1)*1.15*sc,5.4*sc,0);branch.rotation.z=(b?-.7:.7);branch.castShadow=true;tree.add(branch);
 }
 blockers.push({x,z,r:2.8*sc,kind:'tree',object:tree,broken:false});
}
function breakTree(b,dx,dz){
 if(!b||b.broken)return;
 b.broken=true;
 const tree=b.object,idx=blockers.indexOf(b);if(idx>=0)blockers.splice(idx,1);
 const len=Math.hypot(dx,dz)||1;
 fallingTrees.push({tree,age:0,fromX:tree.rotation.x,fromZ:tree.rotation.z,toX:(dz/len)*1.12,toZ:-(dx/len)*1.12});
 treeRespawns.push({tree,x:b.x,z:b.z,r:b.r,kind:'tree',timer:55});
 for(let i=0;i<15;i++){
  const leaf=i%3!==0;
  const mesh=new THREE.Mesh(leaf?new THREE.SphereGeometry(.28,6,5):new THREE.BoxGeometry(.28,.7,.22),leaf?leafMats[i%leafMats.length]:woodMat);
  mesh.position.set(b.x+rand(-1,1),heightAt(b.x,b.z)+rand(2,8),b.z+rand(-1,1));mesh.castShadow=true;scene.add(mesh);
  treeDebris.push({mesh,vx:rand(-5,5),vy:rand(2,8),vz:rand(-5,5),life:1.8});
 }
 if(typeof ambienceContext!=='undefined'&&ambienceContext&&ambienceOn){
  const t=ambienceContext.currentTime,o=ambienceContext.createOscillator(),g=ambienceContext.createGain();
  o.type='triangle';o.frequency.setValueAtTime(115,t);o.frequency.exponentialRampToValueAtTime(48,t+.22);
  g.gain.setValueAtTime(.18,t);g.gain.exponentialRampToValueAtTime(.001,t+.28);
  o.connect(g);g.connect(ambienceMaster);o.start(t);o.stop(t+.3);
 }
}

// The unlocked second island: rebuilt as a warm, detailed Linkou-style outlet town.
const cityIsland=new THREE.Mesh(new THREE.CylinderGeometry(112,126,18,96),new THREE.MeshStandardMaterial({color:0x8a8278,roughness:.96}));cityIsland.position.set(cityX,-3,cityZ);cityIsland.receiveShadow=true;cityIsland.castShadow=true;scene.add(cityIsland);
const cityTopMat=new THREE.MeshStandardMaterial({color:0xb8aa98,roughness:.92});
addMesh(new THREE.CylinderGeometry(108,108,1.2,96),cityTopMat,cityX,cityTop-.65,cityZ);
// Wide stone pedestrian bridge and landscaped entrance.
const bridgeMat=new THREE.MeshStandardMaterial({color:0xb7a995,roughness:.85});
addMesh(new THREE.BoxGeometry(48,2.2,13),bridgeMat,cityX-137,cityTop-1,cityZ);

let ambienceContext=null,ambienceOn=false,ambienceMaster=null,ambienceLayers={},ambienceStarted=false,lastAmbienceScene='';
function makeNoiseLayer(ctx,kind,volume,cutoff){
 const buffer=ctx.createBuffer(1,ctx.sampleRate*5,ctx.sampleRate),data=buffer.getChannelData(0);
 let last=0;for(let i=0;i<data.length;i++){const white=Math.random()*2-1;last=last*.94+white*.06;data[i]=kind==='pink'?last*3.2:white*.72;}
 const src=ctx.createBufferSource();src.buffer=buffer;src.loop=true;
 const filter=ctx.createBiquadFilter();filter.type=kind==='water'?'bandpass':(kind==='high'?'highpass':'lowpass');filter.frequency.value=cutoff;filter.Q.value=kind==='water'?.8:.45;
 const gain=ctx.createGain();gain.gain.value=0;src.connect(filter);filter.connect(gain);gain.connect(ambienceMaster);src.start();
 return {gain,src,filter,base:volume};
}
function makeTone(ctx,freq,type,volume){
 const osc=ctx.createOscillator(),gain=ctx.createGain();osc.type=type;osc.frequency.value=freq;gain.gain.value=0;osc.connect(gain);gain.connect(ambienceMaster);osc.start();return {osc,gain,base:volume};
}
function startAmbience(){
 const AC=window.AudioContext||window.webkitAudioContext;if(!AC){ambienceButton.textContent='此瀏覽器不支援音效';return false;}
 ambienceContext=new AC();ambienceMaster=ambienceContext.createGain();ambienceMaster.gain.value=0;ambienceMaster.connect(ambienceContext.destination);
 // Separate sound layers: wind, rushing water, insects, cave resonance and crystal shimmer.
 ambienceLayers.wind=makeNoiseLayer(ambienceContext,'pink',.23,620);
 ambienceLayers.water=makeNoiseLayer(ambienceContext,'water',.72,920);
 ambienceLayers.waterLow=makeNoiseLayer(ambienceContext,'pink',.38,360);
 ambienceLayers.insects=makeNoiseLayer(ambienceContext,'high',.22,3100);
 ambienceLayers.hum=makeTone(ambienceContext,86,'sine',.16);
 ambienceLayers.crystal=makeTone(ambienceContext,392,'sine',.11);
 ambienceLayers.chime=makeTone(ambienceContext,660,'triangle',.08);
 ambienceLayers.bird=makeTone(ambienceContext,1180,'sine',.035);
 const t=ambienceContext.currentTime;
 // Gentle independent modulation makes the soundscape move rather than stay flat.
 const lfo=ambienceContext.createOscillator(),lfoGain=ambienceContext.createGain();lfo.frequency.value=.13;lfoGain.gain.value=170;lfo.connect(lfoGain);lfoGain.connect(ambienceLayers.water.filter.frequency);lfo.start();
 const windLfo=ambienceContext.createOscillator(),windGain=ambienceContext.createGain();windLfo.frequency.value=.07;windGain.gain.value=.09;windLfo.connect(windGain);windGain.connect(ambienceLayers.wind.gain);windLfo.start();
 ambienceStarted=true;return true;
}
function setAmbienceScene(x,z){
 if(!ambienceStarted||!ambienceOn)return;
 const waterfall=Math.hypot(x-cliffX,z-cliffZ)<95;
 const garden=Math.hypot(x+245,z+235)<105;
 const cave=Math.hypot(x-275,z-225)<90;
 const harbor=Math.hypot(x-275,z+235)<110;
 const city=Math.hypot(x-cityX,z-cityZ)<112;
 const sceneKey=city?'city':waterfall?'waterfall':garden?'garden':cave?'cave':harbor?'harbor':'meadow';
 if(sceneKey===lastAmbienceScene)return;lastAmbienceScene=sceneKey;
 const t=ambienceContext.currentTime;
 const profile=waterfall?{wind:.20,water:.95,waterLow:.82,insects:.04,hum:.04,crystal:.02,chime:.04,bird:.01}
 :garden?{wind:.48,water:.08,waterLow:.04,insects:.78,hum:.04,crystal:.10,chime:.42,bird:.08}
 :cave?{wind:.04,water:.18,waterLow:.12,insects:.01,hum:.92,crystal:.82,chime:.38,bird:0}
 :harbor?{wind:.30,water:.92,waterLow:.68,insects:.18,hum:.06,crystal:.08,chime:.20,bird:.72}
 :city?{wind:.12,water:.32,waterLow:.18,insects:.02,hum:.48,crystal:.22,chime:.75,bird:.04}
 :{wind:.60,water:.06,waterLow:.02,insects:.12,hum:.04,crystal:.04,chime:.12,bird:.42};
 for(const [key,value] of Object.entries(profile)){const layer=ambienceLayers[key];if(layer)layer.gain.gain.setTargetAtTime(layer.base*value,t,1.25);}
 if(ambienceLayers.hum)ambienceLayers.hum.osc.frequency.setTargetAtTime(cave?72:(garden?112:waterfall?94:harbor?118:86),t,1.6);
 if(ambienceLayers.crystal)ambienceLayers.crystal.osc.frequency.setTargetAtTime(cave?294:(garden?523:392),t,1.6);
 if(ambienceLayers.chime)ambienceLayers.chime.osc.frequency.setTargetAtTime(cave?440:(garden?784:waterfall?587:harbor?698:660),t,1.6);
 if(ambienceLayers.bird)ambienceLayers.bird.osc.frequency.setTargetAtTime(meadowFrequency(),t,1.6);
 function meadowFrequency(){return waterfall?900:garden?1040:cave?520:harbor?820:1180;}
}
